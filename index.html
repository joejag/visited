<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countries I've Visited</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🌍</text></svg>">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            line-height: 1.6;
            color: #1f2937;
        }

        .container {
            max-width: 1400px;
            width: 100%;
        }

        .stats {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 1.1rem 1.25rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .stats-grid {
            display: grid;
            gap: 0.8rem;
        }

        .stat-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.6rem 1rem;
            align-items: center;
        }

        .stat-row-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.78);
            font-weight: 600;
        }

        .stat-row-value {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
        }

        .stats-progress {
            grid-column: 1 / -1;
            height: 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.22);
            overflow: hidden;
        }

        .stats-progress-fill {
            height: 100%;
            width: 0;
            border-radius: 999px;
            transition: width 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .stats-note {
            grid-column: 1 / -1;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.68);
            margin-top: -0.35rem;
            line-height: 1.3;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        .map-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            min-height: 700px;
        }

        #map {
            width: 100%;
            height: 700px;
            background: #e5e7eb;
        }

        .leaflet-container {
            background: #e5e7eb;
        }

        .leaflet-tile-pane img {
            image-rendering: pixelated;
            image-rendering: -webkit-optimize-contrast;
        }

        /* Enhance visited country styling */
        .visited-country {
            filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.3));
        }

        .country-label {
            font-weight: bold;
            text-shadow: 1px 1px 2px white, -1px -1px 2px white, 1px -1px 2px white, -1px 1px 2px white;
        }

        .sidebar {
            background: transparent;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            max-height: 700px;
            overflow-y: auto;
        }

        .region-item {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 0.95rem;
            margin-bottom: 0.75rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            line-height: 1.4;
        }

        .region-item:hover {
            border-color: #667eea;
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .region-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.2;
        }

        .region-icon {
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 1.4rem;
            height: 1.4rem;
            line-height: 1;
        }

        .region-countries {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid #d1d5db;
        }

        .region-progress {
            background: #e5e7eb;
            border-radius: 6px;
            height: 6px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .region-progress-bar {
            height: 100%;
            transition: width 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            width: 0;
        }

        .country-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            line-height: 1.6;
        }

        .country-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: white;
            border: 1.5px solid #d1d5db;
            border-radius: 16px;
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s ease;
            cursor: default;
            position: relative;
            line-height: 1.4;
        }

        .country-tag:hover {
            transform: scale(1.06);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .country-tag.visited {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }

        .country-tag.visited:hover {
            background: #a7f3d0;
            border-color: #059669;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
        }

        .country-tag:not(.visited) {
            background: #f3f4f6;
            border-color: #d1d5db;
            color: #6b7280;
        }

        .country-tag:not(.visited):hover {
            background: #e5e7eb;
            border-color: #9ca3af;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .country-tag-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .country-tag[data-year]::after {
            content: attr(data-year);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            margin-bottom: 0.35rem;
        }

        .country-tag[data-year]:hover::after {
            opacity: 1;
        }

        .unvisited-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid #e5e7eb;
        }

        .unvisited-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 0.8rem;
        }

        .region-name {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 0;
            font-size: 0.9rem;
            line-height: 1.2;
        }

        .region-progress {
            background: #e5e7eb;
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .region-progress-bar {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            transition: width 0.3s ease;
        }

        .region-stats {
            font-size: 0.85rem;
            color: #6b7280;
        }

        .region-item.completed .region-name::after {
            content: ' ✓';
            color: #10b981;
        }

        .region-item.completed .region-progress-bar {
            background: #10b981;
        }

        .rest-world-section {
            margin-top: 0.25rem;
            padding: 0.9rem 0.95rem 0.2rem;
            border: 1px solid #dbe4ee;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(249, 250, 251, 0.96));
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
        }

        .rest-world-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.75rem;
        }

        .continent-group {
            margin-bottom: 0.65rem;
            padding-left: 0.55rem;
            border-left: 2px solid #e5e7eb;
        }

        .continent-name {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 0.35rem;
            font-weight: 600;
        }

        .rest-world-section .country-list {
            gap: 0.4rem;
        }

        .rest-world-section .country-tag {
            padding: 0.32rem 0.62rem;
            font-size: 0.76rem;
        }

        .empty-rest-world {
            font-size: 0.8rem;
            color: #64748b;
            padding-bottom: 0.6rem;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: none;
            }

            .stats {
                padding: 1rem;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .map-container {
                min-height: 400px;
            }

            #map {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats">
            <div class="stats-grid">
                <div class="stat-row">
                    <div class="stat-row-title">Europe Progress</div>
                    <div class="stat-row-value" id="europeProgressText">0 / 0 (0%)</div>
                    <div class="stats-progress">
                        <div class="stats-progress-fill" id="europeProgressBar" style="background: linear-gradient(90deg, #10b981, #34d399);"></div>
                    </div>
                </div>

                <div class="stat-row">
                    <div class="stat-row-title">World Total</div>
                    <div class="stat-row-value" id="worldProgressText">0 / 195 (0%)</div>
                    <div class="stats-progress">
                        <div class="stats-progress-fill" id="worldProgressBar" style="background: linear-gradient(90deg, #60a5fa, #22d3ee);"></div>
                    </div>
                    <div class="stats-note">Based on 195 UN member states.</div>
                </div>

            </div>
        </div>

        <div class="content">
            <div class="map-container">
                <div id="map"></div>
            </div>

            <div class="sidebar">
                <div id="regionsContainer"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
    
    <script>
        // ============================================================================
        // COLOR SYSTEM - Minimal, cohesive palette
        // ============================================================================
        const colors = {
            // Primary accent - used for UI elements, progress indicators
            primary: '#3b82f6',           // Bright blue
            
            // Success - used for visited states
            success: '#10b981',           // Vibrant green
            successLight: '#d1fae5',      // Light green background
            successDark: '#065f46',       // Dark green text
            
            // Neutral - used for unvisited states and backgrounds
            neutral50: '#f9fafb',
            neutral100: '#f3f4f6',
            neutral200: '#e5e7eb',
            neutral300: '#d1d5db',
            neutral600: '#4b5563',
            neutral700: '#374151',
            
            // Region palette - harmonious blue/cool tones as base
            // Tints are created by varying saturation and lightness around a cool color base
            regions: {
                'Nordics': '#0369a1',        // Deep cool blue
                'British Isles': '#0891b2', // Cool cyan-blue
                'Benelux': '#0284c7',       // Medium blue
                'Central Europe': '#2563eb', // Vibrant blue
                'Western Europe': '#1e40af', // Rich blue
                'Southern Europe': '#1d4ed8', // Deeper blue
                'Balkans': '#3b82f6',       // Primary blue
                'Eastern Europe': '#06b6d4', // Cyan
                'Baltics': '#0891b2',       // Cyan-blue
                'Microstates': '#1e3a8a'    // Navy blue
            }
        };

        // ============================================================================
        // COUNTRY CODE TO NAME MAPPING
        // ============================================================================
        const countryNames = {
            'IS': 'Iceland', 'NO': 'Norway', 'SE': 'Sweden', 'FI': 'Finland',
            'DK': 'Denmark', 'GB': 'United Kingdom', 'IE': 'Ireland', 'NL': 'Netherlands',
            'BE': 'Belgium', 'LU': 'Luxembourg', 'DE': 'Germany', 'PL': 'Poland',
            'CZ': 'Czech Republic', 'SK': 'Slovakia', 'AT': 'Austria', 'CH': 'Switzerland',
            'FR': 'France', 'ES': 'Spain', 'PT': 'Portugal', 'IT': 'Italy',
            'SI': 'Slovenia', 'HR': 'Croatia', 'BA': 'Bosnia and Herzegovina', 'RS': 'Serbia',
            'ME': 'Montenegro', 'AL': 'Albania', 'MK': 'North Macedonia', 'BG': 'Bulgaria',
            'GR': 'Greece', 'CY': 'Cyprus', 'RO': 'Romania', 'MD': 'Moldova',
            'UA': 'Ukraine', 'BY': 'Belarus', 'LT': 'Lithuania', 'LV': 'Latvia', 'EE': 'Estonia',
            'TR': 'Turkey', 'HU': 'Hungary', 'AD': 'Andorra', 'MC': 'Monaco', 'LI': 'Liechtenstein',
            'SM': 'San Marino', 'VA': 'Vatican City', 'MT': 'Malta',
            'US': 'United States', 'MX': 'Mexico', 'BR': 'Brazil', 'AR': 'Argentina',
            'CL': 'Chile', 'MA': 'Morocco', 'IN': 'India'
        };

        const countryContinents = {
            'US': 'North America',
            'MX': 'North America',
            'BR': 'South America',
            'AR': 'South America',
            'CL': 'South America',
            'MA': 'Africa',
            'IN': 'Asia'
        };

        // Define European regions with their countries, colors, and emojis
        const regions = {
            'Nordics': {
                countries: ['IS', 'NO', 'SE', 'FI', 'DK'],
                color: colors.regions['Nordics'],
                emoji: '❄️'
            },
            'British Isles': {
                countries: ['GB', 'IE'],
                color: colors.regions['British Isles'],
                emoji: '🫖'
            },
            'Benelux': {
                countries: ['NL', 'BE', 'LU'],
                color: colors.regions['Benelux'],
                emoji: '🚲'
            },
            'Central Europe': {
                countries: ['DE', 'PL', 'CZ', 'SK', 'AT', 'CH', 'HU'],
                color: colors.regions['Central Europe'],
                emoji: '🏰'
            },
            'Western Europe': {
                countries: ['FR', 'ES', 'PT'],
                color: colors.regions['Western Europe'],
                emoji: '🍷'
            },
            'Southern Europe': {
                countries: ['IT', 'SI', 'MT', 'GR', 'CY', 'TR'],
                color: colors.regions['Southern Europe'],
                emoji: '☀️'
            },
            'Balkans': {
                countries: ['HR', 'BA', 'RS', 'ME', 'AL', 'MK', 'BG'],
                color: colors.regions['Balkans'],
                emoji: '🏔️'
            },
            'Eastern Europe': {
                countries: ['UA', 'BY', 'RO', 'MD'],
                color: colors.regions['Eastern Europe'],
                emoji: '🌾'
            },
            'Baltics': {
                countries: ['LT', 'LV', 'EE'],
                color: colors.regions['Baltics'],
                emoji: '🌲'
            },
            'Microstates': {
                countries: ['AD', 'MC', 'LI', 'SM', 'VA'],
                color: colors.regions['Microstates'],
                emoji: '✨'
            }
        };

        // Create a region map for quick lookups
        const regionMap = {};
        Object.entries(regions).forEach(([regionName, data]) => {
            data.countries.forEach(country => {
                regionMap[country] = { name: regionName, color: data.color };
            });
        });

        // European country codes for filtering
        const europeanCountries = new Set(
            Object.values(regions).flatMap(r => r.countries)
        );

        // Extra countries for map-only coloring (excluded from European progress totals)
        const extraVisitedCountries = new Set(['US', 'MX', 'BR', 'AR', 'CL', 'MA', 'IN']);
        const extraVisitedCountryColors = {
            'US': '#ef4444',
            'MX': '#f97316',
            'BR': '#22c55e',
            'AR': '#0ea5e9',
            'CL': '#14b8a6',
            'MA': '#f59e0b',
            'IN': '#ec4899'
        };

        // Initialize map centered on Europe
        const map = L.map('map').setView([52.0, 10.0], 4);

        // Add tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let visitedCountries = [];
        let geoJsonLayer = null;

        // Helper function to lighten a color
        function lightenColor(color, opacity) {
            // Convert hex to RGB
            const hex = color.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            
            // Mix with white for lightened effect
            const lightR = Math.round(r + (255 - r) * (1 - opacity));
            const lightG = Math.round(g + (255 - g) * (1 - opacity));
            const lightB = Math.round(b + (255 - b) * (1 - opacity));
            
            return `rgb(${lightR}, ${lightG}, ${lightB})`;
        }

        // Get centroid of a feature for label placement
        function getFeatureCentroid(geometry) {
            if (geometry.type === 'Polygon') {
                const coords = geometry.coordinates[0];
                let sumLat = 0, sumLng = 0;
                coords.forEach(coord => {
                    sumLng += coord[0];
                    sumLat += coord[1];
                });
                return [sumLat / coords.length, sumLng / coords.length];
            } else if (geometry.type === 'MultiPolygon') {
                // Find the largest polygon (mainland)
                let largestPolygon = geometry.coordinates[0];
                let largestArea = 0;
                
                geometry.coordinates.forEach(polygon => {
                    const area = polygon[0].length;
                    if (area > largestArea) {
                        largestArea = area;
                        largestPolygon = polygon;
                    }
                });
                
                let sumLat = 0, sumLng = 0;
                largestPolygon[0].forEach(coord => {
                    sumLng += coord[0];
                    sumLat += coord[1];
                });
                return [sumLat / largestPolygon[0].length, sumLng / largestPolygon[0].length];
            }
            return [0, 0];
        }

        // Load visited countries from JSON
        async function loadVisited() {
            try {
                const response = await fetch('visited.json');
                if (response.ok) {
                    visitedCountries = await response.json();
                }
            } catch (error) {
                console.log('No visited.json found, starting fresh.');
                visitedCountries = [];
            }
            loadMap();
        }

        // Country code mapping from world-atlas data (UN country codes to ISO 3166-1 alpha-2)
        const countryNameMap = {
            '352': 'IS',  // Iceland
            '578': 'NO',  // Norway
            '752': 'SE',  // Sweden
            '246': 'FI',  // Finland
            '208': 'DK',  // Denmark
            '826': 'GB',  // United Kingdom
            '372': 'IE',  // Ireland
            '528': 'NL',  // Netherlands
            '056': 'BE',  // Belgium
            '442': 'LU',  // Luxembourg
            '276': 'DE',  // Germany
            '616': 'PL',  // Poland
            '203': 'CZ',  // Czech Republic
            '703': 'SK',  // Slovakia
            '040': 'AT',  // Austria
            '756': 'CH',  // Switzerland
            '250': 'FR',  // France
            '724': 'ES',  // Spain
            '620': 'PT',  // Portugal
            '380': 'IT',  // Italy
            '300': 'GR',  // Greece
            '191': 'HR',  // Croatia
            '070': 'BA',  // Bosnia and Herzegovina
            '688': 'RS',  // Serbia
            '499': 'ME',  // Montenegro
            '008': 'AL',  // Albania
            '807': 'MK',  // North Macedonia
            '100': 'BG',  // Bulgaria
            '804': 'UA',  // Ukraine
            '112': 'BY',  // Belarus
            '642': 'RO',  // Romania
            '498': 'MD',  // Moldova
            '428': 'LV',  // Latvia
            '440': 'LT',  // Lithuania
            '233': 'EE',  // Estonia
            '643': 'RU',  // Russia
            '792': 'TR',  // Turkey
            '348': 'HU',  // Hungary
            '020': 'AD',  // Andorra
            '492': 'MC',  // Monaco
            '438': 'LI',  // Liechtenstein
            '674': 'SM',  // San Marino
            '336': 'VA',  // Vatican City
            '470': 'MT',  // Malta
            '316': 'MT',  // Malta (alternative code)
            '196': 'CY',  // Cyprus
            '705': 'SI',  // Slovenia
            '840': 'US',  // United States
            '484': 'MX',  // Mexico
            '076': 'BR',  // Brazil
            '032': 'AR',  // Argentina
            '152': 'CL',  // Chile
            '504': 'MA',  // Morocco
            '356': 'IN'   // India
        };

        // Load GeoJSON and create map
        async function loadMap() {
            try {
                const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
                const world = await response.json();
                
                // Convert TopoJSON to GeoJSON
                const countriesGeoJson = topojson.feature(world, world.objects.countries);

                // Create GeoJSON feature collection with country codes
                const europeanGeoJson = {
                    type: 'FeatureCollection',
                    features: countriesGeoJson.features
                        .map(feature => {
                            if (!feature.id) {
                                return null;
                            }
                            const id = feature.id.toString().padStart(3, '0');
                            const countryCode = countryNameMap[id];
                            if (countryCode && (europeanCountries.has(countryCode) || extraVisitedCountries.has(countryCode))) {
                                return {
                                    ...feature,
                                    properties: {
                                        ...feature.properties,
                                        countryCode: countryCode
                                    }
                                };
                            }
                            return null;
                        })
                        .filter(f => f !== null)
                        .concat([
                            // Add Malta manually as a point feature since it's not in the 110m dataset
                            {
                                type: 'Feature',
                                id: 'malta-manual',
                                properties: { countryCode: 'MT' },
                                geometry: {
                                    type: 'Point',
                                    coordinates: [14.375, 35.937]
                                }
                            }
                        ])
                };

                console.log(`Loaded ${europeanGeoJson.features.length} European countries`);
                console.log('Country codes loaded:', europeanGeoJson.features.map(f => f.properties.countryCode).sort().join(', '));

                if (geoJsonLayer) {
                    map.removeLayer(geoJsonLayer);
                }

                geoJsonLayer = L.geoJSON(europeanGeoJson, {
                    style: (feature) => {
                        // Skip styling for Point features (Malta marker)
                        if (feature.geometry.type === 'Point') {
                            return {};
                        }
                        
                        const code = feature.properties.countryCode;
                        const isVisited = visitedCountries.includes(code);
                        const regionData = regionMap[code];
                        const extraColor = extraVisitedCountryColors[code];
                        
                        // Region colors take priority, then map-only extra country colors
                        let color = regionData ? regionData.color : (extraColor || '#9ca3af');
                        let fillColor;
                        let weight;
                        let opacity;
                        
                        if (isVisited) {
                            // Visited: darker, more saturated, with subtle shadow
                            fillColor = color;
                            weight = 1.5;
                            opacity = 1;
                        } else {
                            // Unvisited: very light grey, desaturated
                            fillColor = '#f0f0f0';
                            weight = 0.5;
                            opacity = 0.6;
                        }
                        
                        return {
                            fillColor: fillColor,
                            weight: weight,
                            opacity: opacity,
                            color: isVisited ? color : '#d0d0d0',
                            fillOpacity: isVisited ? 0.85 : 0.3,
                            lineCap: 'round',
                            lineJoin: 'round'
                        };
                    },
                    pointToLayer: (feature, latlng) => {
                        // Handle Malta point marker
                        const code = feature.properties.countryCode;
                        const isVisited = visitedCountries.includes(code);
                        const regionData = regionMap[code];
                        const extraColor = extraVisitedCountryColors[code];
                        let color = regionData ? regionData.color : (extraColor || '#9ca3af');
                        
                        return L.circleMarker(latlng, {
                            radius: isVisited ? 8 : 6,
                            fillColor: isVisited ? color : '#f0f0f0',
                            color: isVisited ? color : '#d0d0d0',
                            weight: isVisited ? 2 : 1,
                            opacity: isVisited ? 1 : 0.6,
                            fillOpacity: isVisited ? 0.85 : 0.3
                        });
                    },
                    onEachFeature: (feature, layer) => {
                        const code = feature.properties.countryCode;
                        if (!code) {
                            console.log('Feature with no country code:', feature.id);
                            return;
                        }
                        const name = countryNames[code] || code;
                        layer.bindPopup(`<strong>${name}</strong> (${code})`);
                        
                        const isVisited = visitedCountries.includes(code);
                        
                        layer.on('mouseover', function() {
                            if (feature.geometry.type === 'Point') {
                                this.setStyle({
                                    radius: isVisited ? 10 : 8,
                                    weight: isVisited ? 2.5 : 1.5,
                                    fillOpacity: isVisited ? 0.95 : 0.5
                                });
                            } else {
                                this.setStyle({
                                    weight: isVisited ? 2.5 : 1,
                                    fillOpacity: isVisited ? 0.95 : 0.5,
                                    color: isVisited ? (regionMap[code]?.color || extraVisitedCountryColors[code] || '#9ca3af') : '#b0b0b0'
                                });
                            }
                            this.bringToFront();
                        });
                        
                        layer.on('mouseout', function() {
                            if (feature.geometry.type === 'Point') {
                                this.setStyle({
                                    radius: isVisited ? 8 : 6,
                                    weight: isVisited ? 2 : 1,
                                    fillOpacity: isVisited ? 0.85 : 0.3
                                });
                            } else {
                                this.setStyle({
                                    weight: isVisited ? 1.5 : 0.5,
                                    fillOpacity: isVisited ? 0.85 : 0.3,
                                    color: isVisited ? (regionMap[code]?.color || extraVisitedCountryColors[code] || '#9ca3af') : '#d0d0d0'
                                });
                            }
                        });
                        
                        // Skip label for Point features
                        if (feature.geometry.type === 'Point') {
                            return;
                        }
                        
                        // Add country code label
                        const centroid = getFeatureCentroid(feature.geometry);
                        L.marker(centroid, {
                            icon: L.divIcon({
                                className: 'country-label',
                                html: `<div style="font-size: 11px; font-weight: bold; color: ${isVisited ? '#1f2937' : '#999'}; text-shadow: 1px 1px 2px white, -1px -1px 2px white, 1px -1px 2px white, -1px 1px 2px white; pointer-events: none;">${code}</div>`,
                                iconSize: [30, 20]
                            })
                        }).addTo(map);
                    }
                }).addTo(map);

                updateStats();
                renderRegions();
            } catch (error) {
                console.error('Error loading map:', error);
            }
        }

        function updateStats() {
            const worldTotalCountries = 195;
            
            const allCountries = new Set();
            Object.values(regions).forEach(regionData => {
                regionData.countries.forEach(c => allCountries.add(c));
            });
            const europeTotalCountries = allCountries.size;
            const europeVisitedCount = Array.from(allCountries).filter(c => visitedCountries.includes(c)).length;
            const europePercentage = Math.round((europeVisitedCount / europeTotalCountries) * 100);

            const worldVisitedCount = new Set(visitedCountries).size;
            const worldPercentage = Math.round((worldVisitedCount / worldTotalCountries) * 100);
            
            document.getElementById('europeProgressText').textContent = `${europeVisitedCount} / ${europeTotalCountries} (${europePercentage}%)`;
            document.getElementById('worldProgressText').textContent = `${worldVisitedCount} / ${worldTotalCountries} (${worldPercentage}%)`;

            document.getElementById('europeProgressBar').style.width = `${europePercentage}%`;
            document.getElementById('worldProgressBar').style.width = `${worldPercentage}%`;
        }

        function countryFlag(code) {
            return code
                .toUpperCase()
                .replace(/./g, char => String.fromCodePoint(127397 + char.charCodeAt(0)));
        }

        function renderRegions() {
            const container = document.getElementById('regionsContainer');
            container.innerHTML = '';

            Object.entries(regions).forEach(([regionName, regionData]) => {
                const countries = regionData.countries;
                const visited = countries.filter(c => visitedCountries.includes(c));
                const unvisited = countries.filter(c => !visitedCountries.includes(c));
                const total = countries.length;
                const percentage = (visited.length / total) * 100;
                const isCompleted = visited.length === total;

                const regionEl = document.createElement('div');
                regionEl.className = `region-item ${isCompleted ? 'completed' : ''}`;
                regionEl.style.borderColor = regionData.color;
                
                const visitedTagsHtml = visited
                    .map(code => `<span class="country-tag visited" data-year="Visited"><span class="country-tag-icon">✓</span>${countryFlag(code)} ${countryNames[code] || code}</span>`)
                    .join('');
                
                const unvisitedTagsHtml = unvisited
                    .map(code => `<span class="country-tag"><span class="country-tag-icon">○</span>${countryFlag(code)} ${countryNames[code] || code}</span>`)
                    .join('');

                const allTagsHtml = visitedTagsHtml + unvisitedTagsHtml;

                regionEl.innerHTML = `
                    <div class="region-header">
                        <span class="region-icon">${regionData.emoji}</span>
                        <div class="region-name" style="color: ${regionData.color}; flex: 1;">${regionName}</div>
                    </div>
                    <div class="region-progress">
                        <div class="region-progress-bar" style="background: ${regionData.color}; width: 0;"></div>
                    </div>
                    ${allTagsHtml ? `<div style="margin-top: 0.5rem;"><div class="country-list" style="opacity: 1;">${allTagsHtml}</div></div>` : ''}
                `;

                container.appendChild(regionEl);
                
                // Trigger animation after adding to DOM
                setTimeout(() => {
                    const progressBar = regionEl.querySelector('.region-progress-bar');
                    progressBar.style.width = percentage + '%';
                }, 10);
            });

            const nonEuropeanVisited = Array.from(
                new Set(visitedCountries.filter(code => !europeanCountries.has(code)))
            );

            const continentOrder = ['North America', 'South America', 'Africa', 'Asia', 'Oceania', 'Other'];
            const continentGroups = continentOrder.reduce((acc, continent) => {
                acc[continent] = [];
                return acc;
            }, {});

            nonEuropeanVisited.forEach(code => {
                const continent = countryContinents[code] || 'Other';
                if (!continentGroups[continent]) {
                    continentGroups[continent] = [];
                }
                continentGroups[continent].push(code);
            });

            const restSection = document.createElement('div');
            restSection.className = 'rest-world-section';

            const continentsWithVisits = Object.entries(continentGroups)
                .filter(([, codes]) => codes.length > 0)
                .map(([continent, codes]) => {
                    const tags = codes
                        .sort((a, b) => (countryNames[a] || a).localeCompare(countryNames[b] || b))
                        .map(code => `<span class="country-tag visited" data-year="Visited"><span class="country-tag-icon">✓</span>${countryFlag(code)} ${countryNames[code] || code}</span>`)
                        .join('');

                    return `
                        <div class="continent-group">
                            <div class="continent-name">${continent}</div>
                            <div class="country-list">${tags}</div>
                        </div>
                    `;
                })
                .join('');

            restSection.innerHTML = `
                <div class="rest-world-title">🌍 Rest of the World</div>
                ${continentsWithVisits || '<div class="empty-rest-world">No non-European countries visited yet.</div>'}
            `;

            container.appendChild(restSection);
        }

        // Initialize
        loadVisited();
    </script>
</body>
</html>
